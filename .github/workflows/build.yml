name: CI Build & Release

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release (ignore version checks)'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build-and-release:
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify latest stable Morphe releases
        id: morphe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          get_stable_tag() {
            local repo="$1"
            local release tag
            release="$(gh api "repos/${repo}/releases/latest")"
            tag="$(jq -r '.tag_name // empty' <<<"$release")"

            if [ -z "$tag" ] ||
               [ "$(jq -r '.draft' <<<"$release")" != "false" ] ||
               [ "$(jq -r '.prerelease' <<<"$release")" != "false" ] ||
               [[ "$tag" =~ (dev|alpha|beta|rc) ]]; then
              echo "::error::Refusing non-stable or invalid release for ${repo}: ${tag:-missing tag}"
              return 1
            fi

            printf '%s' "$tag"
          }

          PATCHES_TAG="$(get_stable_tag MorpheApp/morphe-patches)"
          CLI_TAG="$(get_stable_tag MorpheApp/morphe-desktop)"

          echo "patches_tag=$PATCHES_TAG" >> "$GITHUB_OUTPUT"
          echo "cli_tag=$CLI_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest stable Morphe Patches: $PATCHES_TAG"
          echo "Latest stable Morphe Desktop CLI: $CLI_TAG"

          # This workflow must always resolve versions dynamically from stable releases.
          if grep -Eiq '^[[:space:]]*(patches-version|cli-version)[[:space:]]*=' config.toml; then
            echo "::error::Remove explicit patches-version/cli-version overrides from config.toml; they can pin or select non-latest builds."
            exit 1
          fi

      - name: Should build?
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          MORPHE_PATCHES_TAG: ${{ steps.morphe.outputs.patches_tag }}
          MORPHE_CLI_TAG: ${{ steps.morphe.outputs.cli_tag }}
        run: |
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build requested!"
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
          elif ! git ls-remote --exit-code --heads origin update >/dev/null 2>&1 || ! git checkout origin/update -- build.md 2>/dev/null; then
            echo "First time building!"
            echo "SHOULD_BUILD=1" >> $GITHUB_OUTPUT
          else
            PREVIOUS_PATCHES_TAG=$(git show origin/update:morphe-stable-versions.txt 2>/dev/null | sed -n 's/^patches=//p' || true)
            PREVIOUS_CLI_TAG=$(git show origin/update:morphe-stable-versions.txt 2>/dev/null | sed -n 's/^cli=//p' || true)

            if [ "$MORPHE_PATCHES_TAG" != "$PREVIOUS_PATCHES_TAG" ] || [ "$MORPHE_CLI_TAG" != "$PREVIOUS_CLI_TAG" ]; then
              echo "A newer stable Morphe release is available."
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            else
              UPDATE_CFG=$(./build.sh config.toml --config-update)
              if [ "$UPDATE_CFG" ]; then
                echo "'$UPDATE_CFG'"
                echo "$UPDATE_CFG" > config.json
                echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
              else
                echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Setup Java
        if: steps.check.outputs.SHOULD_BUILD == '1'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Python
        if: steps.check.outputs.SHOULD_BUILD == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        if: steps.check.outputs.SHOULD_BUILD == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dl-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Build Tools
        if: steps.check.outputs.SHOULD_BUILD == '1'
        uses: actions/cache@v4
        with:
          path: |
            bin/
          key: ${{ runner.os }}-build-tools-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-tools-

      - name: Setup BouncyCastle Provider
        if: steps.check.outputs.SHOULD_BUILD == '1'
        run: |
          mkdir -p temp
          if [ ! -f "temp/bcprov.jar" ]; then
            curl -L -o temp/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78/bcprov-jdk18on-1.78.jar
          fi
          sudo cp temp/bcprov.jar /usr/lib/jvm/zulu21/lib/ 2>/dev/null || sudo cp temp/bcprov.jar "$JAVA_HOME/lib/" || :

      - name: Get next version code
        if: steps.check.outputs.SHOULD_BUILD == '1'
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract all purely numeric tags, find the maximum, and increment
          HIGHEST_TAG=$(gh release list -L 100 --json tagName -q '.[].tagName' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          if [ -z "$HIGHEST_TAG" ]; then
            NEXT_TAG=1
          else
            NEXT_TAG=$((HIGHEST_TAG + 1))
          fi
          echo "NEXT_VER_CODE=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Selected Release Tag: $NEXT_TAG"

      - name: Install downloader deps
        if: steps.check.outputs.SHOULD_BUILD == '1'
        run: |
          pip install curl_cffi beautifulsoup4
          # Only pull in the heavy browser stack if APKMirror blocks this runner
          if python3 - <<'PY'
          import sys
          from curl_cffi import requests
          try:
              r = requests.get("https://www.apkmirror.com/apk/google-inc/youtube/", impersonate="chrome", timeout=30)
              sys.exit(0 if r.status_code == 200 else 1)
          except Exception:
              sys.exit(1)
          PY
          then
            echo "APKMirror reachable without a browser"
          else
            echo "Blocked, installing browser fallback"
            pip install seleniumbase
            command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          fi

      - name: Clear cached Morphe prebuilts
        if: steps.check.outputs.SHOULD_BUILD == '1'
        shell: bash
        run: |
          # get_prebuilts() searches these directories before downloading.
          # Clearing them guarantees the current stable release is fetched.
          rm -rf temp/*-rv

      - name: Build modules/APKs
        if: steps.check.outputs.SHOULD_BUILD == '1'
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        if: steps.check.outputs.SHOULD_BUILD == '1'
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Get patches version for title
        if: steps.check.outputs.SHOULD_BUILD == '1'
        id: patches_ver
        run: |
          PV=$(grep -m1 '^Patches: ' build.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$PV" ]; then PV="${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"; fi
          echo "VER=$PV" >> "$GITHUB_OUTPUT"

      - name: Upload release
        if: steps.check.outputs.SHOULD_BUILD == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
          VER: ${{ steps.patches_ver.outputs.VER }}
        run: |
          # Always create a new release under the incremented tag
          gh release create "$TAG" ./build/* --title "$VER ($TAG)" --notes "$BODY"

      - name: Update modules changelog and update json
        if: steps.check.outputs.SHOULD_BUILD == '1'
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          {
            echo "patches=${{ steps.morphe.outputs.patches_tag }}"
            echo "cli=${{ steps.morphe.outputs.cli_tag }}"
          } > morphe-stable-versions.txt

          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        if: steps.check.outputs.SHOULD_BUILD == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.md morphe-stable-versions.txt *-update.json

          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Clear older runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -P8 -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

      - name: Report to Telegram
        if: steps.check.outputs.SHOULD_BUILD == '1' && env.TG_TOKEN != null
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}

          BODY="$(sed 's/^\* \*\*/↪ \*\*/g; s/^\* `/↪ \*\*/g; s/`/\*/g; s/^\* /\↪/g; s/\*\*/\*/g; s/###//g; s/^- /↪ /g; /^==/d;' ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          Modules:
          ${MODULES}

          APKs:
          ${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
